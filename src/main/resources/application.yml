server:
  port: 8080

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/fleet_db
    username: postgres
    password: password
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false

  data:
    redis:
      host: localhost
      port: 6379

